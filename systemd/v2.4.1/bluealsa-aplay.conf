[Unit]
Wants=bluealsa.service
After=bluetooth.service bluealsa.service
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/bluebridge/player.py
User=bluebridge
Group=audio
PrivateUsers=false
RuntimeDirectory=bluebridge-player
RuntimeDirectoryMode=0750
Restart=always
RestartSec=5
TimeoutStopSec=10
MemoryMax=128M
TasksMax=32
LogRateLimitIntervalSec=30s
LogRateLimitBurst=30
